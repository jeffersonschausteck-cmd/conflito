name = "conflito-multiplayer"
main = "src/index.ts"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]

# Sprint MP-04 — cada sala é um Durable Object independente
# ("GameRoom"); "AccountsRoom" é a única instância fixa que trata
# Login/Cadastro/Criar Sala/Entrar Sala antes de existir uma sala.
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountsRoom"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

# Remetente dos e-mails de confirmação (não é segredo). A chave do Resend fica no segredo
# RESEND_API_KEY (`wrangler secret put`). O domínio precisa estar verificado no Resend.
[vars]
EMAIL_FROM = "Conflito <no-reply@conflito.online>"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountsRoom", "GameRoom"]
