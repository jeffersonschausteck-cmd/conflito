# Publica o Conflito no Cloudflare a cada envio ao main.
#
# Ordem: servidor multiplayer primeiro (só quando algo que ele usa mudou) e depois o site.
# Precisa de dois segredos no GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   (token com o modelo "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  (o ID da conta, que aparece no painel do Cloudflare)
# Sem os segredos, o fluxo só avisa e não publica nada.
name: Publicar no Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # também dá para rodar à mão na aba Actions

# Nunca dois deploys ao mesmo tempo; o segundo espera o primeiro terminar.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir os segredos do Cloudflare
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segredos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID não configurados. Nada foi publicado."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ver se o servidor multiplayer mudou
        id: changes
        if: steps.creds.outputs.ok == 'true'
        run: |
          before="${{ github.event.before }}"
          server=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || echo "$before" | grep -qE '^0+$' || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            server=true # execução manual ou primeiro envio: publica o servidor também
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(multiplayer-worker/|src/(services|types|config|multiplayer|maps)/)'; then
            server=true
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "Publicar o servidor multiplayer: $server"

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ok == 'true'

      # 1) Servidor multiplayer (Durable Objects). Os segredos dele (RESEND_API_KEY) ficam no Cloudflare e não mudam.
      - name: Publicar o servidor multiplayer
        if: steps.creds.outputs.ok == 'true' && steps.changes.outputs.server == 'true'
        working-directory: multiplayer-worker
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy -c wrangler.toml

      # 2) Site. O nome do worker é fixo para nunca criar um worker novo por engano.
      - name: Instalar e construir o site
        if: steps.creds.outputs.ok == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Publicar o site
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy --name jeffersonschausteck-cmd-conflito
